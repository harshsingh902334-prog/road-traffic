<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SignalOS — Login</title>

  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.70/build/spline-viewer.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --white: #fff;
      --dark: #111827;
      --accent: #2563EB;
      --muted: #6B7280;
      --border: #E5E7EB;
      --input: #F9FAFB;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #c9e8ff, #e8f4ff, #d4ecff);
      font-family: 'DM Sans', sans-serif;
      padding: 20px;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      filter: blur(40px);
      pointer-events: none;
    }

    body::before { width: 500px; height: 300px; top: -80px; left: -100px; }
    body::after  { width: 400px; height: 250px; bottom: -60px; right: -80px; }

    /* Back to home link */
    .back-home {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: rgba(17,24,39,0.55);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      padding: 7px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.9);
      transition: all 0.2s;
    }
    .back-home:hover {
      background: rgba(255,255,255,0.95);
      color: var(--dark);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .back-home svg { flex-shrink: 0; }

    .card {
      display: flex;
      width: 100%;
      max-width: 950px;
      min-height: 580px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.08), 0 25px 80px rgba(0,0,0,.15);
    }

    .left {
      flex: 1.3;
      position: relative;
      background: linear-gradient(145deg, #a8d8f0, #5ba3c9);
      overflow: hidden;
    }

    spline-viewer {
      width: 100%;
      height: calc(100% + 60px);
      display: block;
      margin-bottom: -60px;
    }

    .overlay-fade {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 120px;
      background: linear-gradient(to top, rgba(15,10,30,0.82) 0%, rgba(15,10,30,0.55) 40%, transparent 100%);
      z-index: 5;
      pointer-events: none;
    }

    .tagline {
      position: absolute;
      bottom: 38px; left: 30px;
      color: white;
      font-family: 'Nunito';
      font-weight: 900;
      font-size: 28px;
      z-index: 6;
      line-height: 1.2;
      text-shadow: 0 2px 16px rgba(0,0,0,0.4);
    }

    .right {
      flex: 1;
      padding: 40px 38px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand { text-align: center; margin-bottom: 20px; }
    .brand-icon {
      width: 44px; height: 44px;
      background: var(--dark);
      border-radius: 12px;
      display: grid; place-items: center;
      margin: auto; margin-bottom: 8px;
      font-size: 22px;
    }
    .brand-name {
      font-family: 'Nunito';
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 13px;
    }

    h1 {
      text-align: center;
      font-family: 'Nunito';
      font-weight: 900;
      margin-bottom: 5px;
      font-size: 24px;
    }

    .sub { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 25px; }

    .field { margin-bottom: 15px; }
    .field label { font-size: 12px; font-weight: 500; margin-bottom: 5px; display: block; color: #374151; }
    .field input {
      width: 100%; padding: 11px 13px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--input);
      outline: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      transition: border-color 0.2s, background 0.2s;
    }
    .field input:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
    }

    .row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; margin-bottom: 18px; color: var(--muted);
    }
    .row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .row a { color: var(--accent); text-decoration: none; }

    /* Error message */
    .err-msg {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #dc2626;
      margin-bottom: 14px;
      text-align: center;
    }
    .err-msg.on { display: block; }

    .btn-primary {
      width: 100%; padding: 13px;
      background: var(--dark);
      color: white; border: none;
      border-radius: 10px; cursor: pointer;
      font-weight: 700; font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      margin-bottom: 12px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover { background: #1f2937; }
    .btn-primary:active { transform: scale(0.98); }

    .divider {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px; color: var(--muted); font-size: 12px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .btn-google {
      width: 100%; padding: 11px;
      border-radius: 10px; border: 1.5px solid var(--border);
      background: white; cursor: pointer;
      margin-bottom: 15px;
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .btn-google:hover { border-color: #c5c5c5; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    .signup { text-align: center; font-size: 12px; color: var(--muted); }
    .signup a { color: var(--accent); text-decoration: none; font-weight: 600; }

    @media (max-width: 700px) {
      .left { display: none; }
      .card { max-width: 420px; }
      .back-home { font-size: 11px; padding: 6px 12px; }
    }
  </style>
</head>
<body>

  <!-- Back to Landing Page -->
  <a href="index.html" class="back-home">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Back to Home
  </a>

  <div class="card">

    <div class="left">
      <spline-viewer url="https://prod.spline.design/C1Imu23hnVJBjmcL/scene.splinecode"></spline-viewer>
      <div class="overlay-fade"></div>
      <div class="tagline">SIGNAL<br>CONTROL.</div>
    </div>

    <div class="right">

      <div class="brand">
        <div class="brand-icon">🚦</div>
        <div class="brand-name">SIGNAL OS</div>
      </div>

      <h1>OPERATOR LOGIN</h1>
      <p class="sub">Enter your credentials to access the control dashboard</p>

      <div class="err-msg" id="errMsg">Invalid credentials. Please try again.</div>

      <div class="field">
        <label>Email / Operator ID</label>
        <input type="email" id="emailInput" placeholder="operator@signalos.in">
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="passInput" placeholder="Enter your password">
      </div>

      <div class="row">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot Password?</a>
      </div>

      <button class="btn-primary" onclick="handleLogin()">Access Dashboard →</button>

      <div class="divider">or</div>

      <button class="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.8 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 20-8.9 20-20 0-1.3-.1-2.6-.4-3.9z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.8 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.4 35.5 26.8 36.5 24 36.5c-5.2 0-9.6-3.3-11.3-8H6.4C9.8 37.5 16.3 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.8l6.2 5.2C41.1 35.7 44 30.2 44 24c0-1.3-.1-2.6-.4-3.9z"/>
        </svg>
        Sign in with Google
      </button>

      <p class="signup">Don't have access? <a href="#">Request Account</a></p>

    </div>
  </div>

  <script>
    function handleLogin() {
      const email = document.getElementById('emailInput').value.trim();
      const pass  = document.getElementById('passInput').value;
      const err   = document.getElementById('errMsg');

      // Basic validation — replace with real auth as needed
      if (!email || !pass) {
        err.textContent = 'Please enter both email and password.';
        err.classList.add('on');
        return;
      }

      // Accept any non-empty credentials and go to dashboard
      // (swap this logic with real auth when ready)
      err.classList.remove('on');
      window.location.href = 'dashboard.html';
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });

    // Spline watermark hide
    document.addEventListener('DOMContentLoaded', () => {
      const viewer = document.querySelector('spline-viewer');
      if (!viewer) return;
      const tryHide = () => {
        if (viewer.shadowRoot) {
          const style = document.createElement('style');
          style.textContent = `#logo, a[href*="spline"], [class*="logo"], [class*="watermark"], [class*="brand"], canvas + div, div[style*="position: absolute"] a { display: none !important; }`;
          viewer.shadowRoot.appendChild(style);
        }
      };
      tryHide();
      viewer.addEventListener('load', tryHide);
      setTimeout(tryHide, 2000);
      setTimeout(tryHide, 4000);
    });
  </script>

</body>
</html>
