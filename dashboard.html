<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Monitoring Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #0d1117;
      overflow: hidden;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 100vh;
      gap: 6px;
      padding: 6px;
    }

    .cam {
      position: relative;
      background: #111;
      border-radius: 10px;
      overflow: hidden;
    }

    .cam video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .label {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-family: sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div class="grid">

    <div class="cam">
      <video src="north.mp4" autoplay muted loop playsinline></video>
      <div class="label">↑ NORTH</div>
    </div>

    <div class="cam">
      <video src="south.mp4" autoplay muted loop playsinline></video>
      <div class="label">↓ SOUTH</div>
    </div>

    <div class="cam">
      <video src="east.mp4" autoplay muted loop playsinline></video>
      <div class="label">→ EAST</div>
    </div>

    <div class="cam">
      <video src="west.mp4" autoplay muted loop playsinline></video>
      <div class="label">← WEST</div>
    </div>

  </div>
</body>
</html>
